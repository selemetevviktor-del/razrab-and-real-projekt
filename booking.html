<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Бронирование номера — Hotel lux</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', Arial, sans-serif; font-style: italic; background: #fff; color: #000; }

    /* Навигация */
    .navbar-hotel { background: #0b1a2e; min-height: 70px; padding: 0 5% 0 5%; }
    .navbar-hotel .navbar-brand { color: #fff; font-size: 1.5rem; font-weight: 500; display: flex; align-items: center; }
    .navbar-hotel .navbar-brand img { height: 60px; width: 60px; object-fit: cover; margin-right: 2rem; }
    .navbar-hotel .nav-link { color: #fff; font-size: 1.4rem; font-style: normal; letter-spacing: .04em; padding: .5rem 2.2rem; }
    .navbar-hotel .nav-link:hover { color: #c49a5c; }
    .btn-book { background: #c49a5c; color: #fff; font-size: 1.4rem; font-style: normal; letter-spacing: .04em;
      border-radius: 30px; padding: .35rem 1.4rem; }
    .btn-book:hover { background: #b08849; color: #fff; }
    .navbar-toggler { border-color: rgba(255,255,255,.5); }
    .navbar-toggler-icon { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255,255,255,0.9)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e"); }

    /* Страница «Бронирование» */
    .page-title { font-size: 2.2rem; font-style: normal; font-weight: 400; margin: 2.4rem 0 2rem 5%; letter-spacing: .02em; }
    .form-panel { background: #f7f5f6; padding: 2rem 2rem 4rem; font-style: normal; }
    .form-panel h3 { font-size: 1.7rem; font-weight: 400; margin: 0 0 1.6rem; }
    .form-panel h3.second { margin-top: 1.6rem; }
    .form-panel label { font-size: 1.25rem; color: #444; font-weight: 400; margin-bottom: .7rem; letter-spacing: .02em; }
    .form-panel .form-control { background: #d9d9d9; border: 0; border-radius: 20px; height: 54px; padding: 0 1.5rem; font-size: 1rem; }
    .form-panel .form-control:focus { background: #d0d0d0; box-shadow: 0 0 0 .2rem rgba(196,154,92,.4); }
    .form-panel .form-group { margin-bottom: 1.9rem; }
    .summary { background: #d9d9d9; font-style: normal; }
    .summary img { width: 100%; height: 150px; object-fit: cover; display: block; }
    .summary-body { padding: 1.4rem 1.4rem 3.5rem; font-size: .8rem; font-weight: 500; }
    .summary-body .title { margin-bottom: 1.3rem; }
    .summary-body .row-item { margin: 0 0 1.2rem 1rem; }
    .summary-body .total { margin: 2.6rem 0 0 1rem; }
    footer { background: #0b1a2e; color: #fff; text-align: center; padding: 1.2rem 0; font-style: italic; margin-top: 3rem; }
  </style>
</head>
<body>

  <!-- Меню -->
  <nav class="navbar navbar-expand-lg navbar-hotel">
    <a class="navbar-brand" href="index.html">
      <img src="img/logo.png" alt="Логотип Hotel lux">Hotel lux
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false" aria-label="Меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainMenu">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="rooms.html">Номера</a></li>
        <li class="nav-item"><a class="nav-link" href="#services">Услуги</a></li>
        <li class="nav-item"><a class="nav-link" href="#about">О нас</a></li>
      </ul>
      <a class="btn btn-book" href="booking.html">Забронировать</a>
    </div>
  </nav>



  <h1 class="page-title">Бронирование номера</h1>

  <main class="container-fluid px-lg-5">
    <div class="row">

      <div class="col-lg-9 mb-4">
        <form class="form-panel">
          <h3>Данные о бронировании</h3>
          <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="checkin">Дата заезда</label>
              <input type="date" class="form-control" id="checkin" placeholder="............................................">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="checkout">Дата выезда</label>
              <input type="date" class="form-control" id="checkout" placeholder="............................................">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="category">Категория номера</label>
              <select class="form-control" id="category"><option value="" selected>............................................</option><option>Стандартный номер</option><option>Улучшенный номер</option><option>Люкс</option></select>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="guests">Количество гостей</label>
              <select class="form-control" id="guests"><option value="" selected>............................................</option><option>1</option><option>2</option><option>3</option></select>
            </div>
          </div>
          </div>

          <h3 class="second">Ваши данные</h3>
          <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="firstname">Имя</label>
              <input type="text" class="form-control" id="firstname" placeholder="............................................">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="lastname">Фамилия</label>
              <input type="text" class="form-control" id="lastname" placeholder="............................................">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" class="form-control" id="email" placeholder="............................................">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="phone">Телефон</label>
              <input type="tel" class="form-control" id="phone" placeholder="............................................">
            </div>
          </div>
          </div>
        </form>
      </div>

      <aside class="col-lg-3 mb-4">
        <div class="summary">
          <img src="img/room2.jpg" alt="Улучшенный номер">
          <div class="summary-body">
            <div class="title">Улучшенный номер</div>
            <div class="row-item">Заезд</div>
            <div class="row-item">Выезд</div>
            <div class="row-item">Ночей</div>
            <div class="row-item">Гостей</div>
            <div class="total">Итого</div>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <footer>Hotel lux</footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
